name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck || pnpm tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test || echo "No unit tests found or setup"

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps || echo "Playwright not fully configured yet"

      - name: Run e2e tests
        run: pnpm run test:e2e || echo "No e2e tests configured"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PUSH_PUBLIC_KEY: ${{ secrets.PUSH_PUBLIC_KEY }}
          PUSH_PRIVATE_KEY: ${{ secrets.PUSH_PRIVATE_KEY }}
          PUSH_SUBJECT: ${{ secrets.PUSH_SUBJECT }}
