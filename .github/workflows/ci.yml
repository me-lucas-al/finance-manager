name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_manager
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5433/finance_manager' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'nO0uBk2mBfICrf2WrBMHSEzwdUgcfCSGOM1eHL/yFhY=' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'dev_cron_secret_12345' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_ci_dummy_token_1234567890' }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'FinanceManager <onboarding@resend.dev>' }}
      PUSH_PUBLIC_KEY: ${{ secrets.PUSH_PUBLIC_KEY || 'BN_0V61AoZNr2I9R7EOpfyt2zwsc0-pVKT2HwsNMdRCdRsKEFfUIes4Zqgw6cpxB49Ap5LvZMnDTO6RAc0Ks4QI' }}
      PUSH_PRIVATE_KEY: ${{ secrets.PUSH_PRIVATE_KEY || 'jWLLmiowkWa2X45vX_QoEQ8sDYJJqQuka10nP43wXDk' }}
      PUSH_SUBJECT: ${{ secrets.PUSH_SUBJECT || 'mailto:test@example.com' }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'BN_0V61AoZNr2I9R7EOpfyt2zwsc0-pVKT2HwsNMdRCdRsKEFfUIes4Zqgw6cpxB49Ap5LvZMnDTO6RAc0Ks4QI' }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || 'jWLLmiowkWa2X45vX_QoEQ8sDYJJqQuka10nP43wXDk' }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:test@example.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test

      - name: Push Database Schema
        run: pnpm run db:push

      - name: Build
        run: pnpm run build

  migrate-supabase:
    # Applies supabase/migrations/*.sql to the production Supabase project.
    # Runs only on pushes to main, after build-and-test passes.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret $v (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # 0001-0006 were applied by hand before this job existed; record them as
      # applied so only newer migrations are executed. Safe to repeat.
      - name: Baseline already-applied migrations
        run: supabase migration repair --status applied 0001 0002 0003 0004 0005 0006 --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
